# Declare our own workspace so Cargo doesn't auto-include this crate in a
# downstream workspace when Lake materializes the package under `.lake/`.
[workspace]

[package]
name = "blake3-rs"
version = "0.1.0"
edition = "2024"

[lib]
# `staticlib` is linked into final Lean executables. `cdylib` additionally
# builds a position-independent shared object exporting the raw `rs_blake3_*`
# symbols, so they can be loaded at runtime — e.g. by Lean's native evaluator
# for `native_decide` proofs elaborated before any executable is linked.
crate-type = ["staticlib", "cdylib"]

[dependencies]
blake3 = "1.8.7"
lean-ffi = { git = "https://github.com/argumentcomputer/lean-ffi", rev = "2a9c91eba44ea791978a086a6a19b3a922edfee5" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
