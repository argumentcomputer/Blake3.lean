# Declare our own workspace so Cargo doesn't auto-include this crate in a
# downstream workspace when Lake materializes the package under `.lake/`.
[workspace]

[package]
name = "blake3-rs"
version = "0.1.0"
edition = "2024"

[lib]
# `staticlib` is linked into final Lean executables. `cdylib` additionally
# builds a position-independent shared object exporting the raw `rs_blake3_*`
# symbols, so they can be loaded at runtime — e.g. by Lean's native evaluator
# for `native_decide` proofs elaborated before any executable is linked.
crate-type = ["staticlib", "cdylib"]

[dependencies]
blake3 = "1.8.7"
lean-ffi = { git = "https://github.com/argumentcomputer/lean-ffi", rev = "93c7e52952ae94546be08313f4ff3922984c84d5" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[lints.rust]
invalid_reference_casting = "warn"
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Casts
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
char_lit_as_u8 = "warn"
checked_conversions = "warn"
fn_to_numeric_cast = "warn"
fn_to_numeric_cast_with_truncation = "warn"
invalid_upcast_comparisons = "warn"
ptr_as_ptr = "warn"
unnecessary_cast = "warn"
# Everything else
dbg_macro = "warn"
derive_partial_eq_without_eq = "warn"
disallowed_methods = "warn"
enum_glob_use = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
macro_use_imports = "warn"
manual_assert = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_flatten = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_value = "warn"
option_option = "warn"
same_functions_in_if_condition = "warn"
trait_duplication_in_bounds = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
